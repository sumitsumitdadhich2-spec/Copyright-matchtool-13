# pnpm settings (single source of truth).
#
# Since pnpm 11 the "pnpm" field in package.json and every non-auth setting in
# .npmrc are IGNORED. All project settings must live here. The pinned pnpm
# version is in package.json -> "packageManager" and must match PNPM_VERSION
# in the Dockerfile.

# Was package.json -> pnpm.overrides. Must be here, otherwise pnpm 11 sees
# "no overrides" while pnpm-lock.yaml records one and --frozen-lockfile fails
# with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
overrides:
  hono: 4.12.25

# --- Build-script policy (replaces onlyBuiltDependencies, removed in pnpm 11) --
# strictDepBuilds is on by default in pnpm 11: every dependency that ships an
# install/postinstall script MUST be listed here as true (run) or false (skip),
# otherwise install fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  # Local-dev fallback binaries (lib/ffmpeg-bin.ts). In Docker the runtime
  # image uses the static /usr/bin/ffmpeg instead; the download only happens
  # in the cached deps layer and is never copied into the runtime image.
  ffmpeg-static: true
  ffprobe-static: true
  # Needed for the standalone build's symlink-tracing fix to work correctly.
  '@google/genai': true
  # Prints a "thank you" banner only.
  msw: false
  # Version-consistency check for its own sub-packages; not needed at runtime.
  protobufjs: false
  # Prebuilt binary comes from the matching optional @unrs/resolver-binding-*
  # package; postinstall is only a fallback check.
  unrs-resolver: false

# --- Supply-chain policy -------------------------------------------------------
# Keep pnpm 11's default: a version must be >= 1 day old before it can be
# resolved/installed. Applies equally to `pnpm install` locally and to the
# frozen install in Docker, so the lockfile is never newer than what CI accepts.
minimumReleaseAge: 1440
# Scoped escape hatch: exact versions only (never bare package names), so the
# policy still applies to every future release. Remove entries here once they
# age past 24h naturally on the next dependency bump.
minimumReleaseAgeExclude: []
